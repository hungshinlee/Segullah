name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 第二道保險。第一道是 commit 前在本機跑同一支。
      - name: Check for content that should not be public
        run: python3 scripts/check.py

      # 只把網頁本身放上站；README、scripts/、.github/ 不上站。
      - name: Assemble site
        run: |
          mkdir _site
          rsync -a \
            --exclude '.git' --exclude '.github' --exclude 'scripts' \
            --exclude 'README.md' --exclude '_site' \
            ./ _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
